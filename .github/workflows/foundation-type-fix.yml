name: Apply Foundation type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: foundation/bootstrap
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Narrow resolved parent id
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/roadmap-import/src/db.ts')
          text = path.read_text()
          old = '        if (parentCol) {\n          baseCols.push(parentCol);\n          baseVals.push(parentId);\n        }'
          new = '        if (parentCol && parentId !== undefined) {\n          baseCols.push(parentCol);\n          baseVals.push(parentId);\n        }'
          if old not in text:
              raise SystemExit('Expected parentId block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format changed files
        run: pnpm dlx prettier@3.9.6 --write scripts/roadmap-import/src/db.ts pnpm-lock.yaml
      - name: Commit type and lockfile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/roadmap-import/src/db.ts pnpm-lock.yaml
          git diff --cached --quiet && { echo 'Type/lockfile fix already applied'; exit 0; }
          git commit -m 'fix: complete Foundation script typing'
          git push origin HEAD:foundation/bootstrap
