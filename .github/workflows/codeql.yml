name: CodeQL
on:
  push:
    branches: [main, "foundation/**", "chore/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  security-events: write
  packages: read
  contents: read
jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
