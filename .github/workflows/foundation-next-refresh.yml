name: Refresh Foundation Next dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: foundation/bootstrap
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format lockfile
        run: pnpm dlx prettier@3.9.6 --write pnpm-lock.yaml
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet && { echo 'Lockfile already current'; exit 0; }
          git commit -m 'build: refresh patched Next.js lockfile'
          git push origin HEAD:foundation/bootstrap
