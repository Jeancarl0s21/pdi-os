# Transport-only workflow; removed after successful materialization.
name: Materialize Foundation payload

on:
  push:
    branches:
      - foundation/bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    name: materialize-foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: foundation/bootstrap

      - name: Detect transport payload
        id: payload
        shell: bash
        run: |
          if [[ -d .foundation-payload ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Foundation payload already removed; nothing to materialize.'
          fi

      - name: Reconstruct and validate Foundation archive
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          part_count="$(find .foundation-payload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "$part_count" -eq 13
          find .foundation-payload -maxdepth 1 -type f -name 'part-*' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/foundation.b64
          base64 --decode /tmp/foundation.b64 > /tmp/foundation.tar.gz
          echo 'ea13a687895455eb01c2e9b7dadcbbe0c77af5c4bd81f828735c83649f0e9600  /tmp/foundation.tar.gz' | sha256sum -c -
          gzip -t /tmp/foundation.tar.gz
          tar -tzf /tmp/foundation.tar.gz > /tmp/foundation-files.txt
          test -s /tmp/foundation-files.txt

      - name: Materialize real Foundation tree
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/foundation.tar.gz -C .
          rm -rf .foundation-payload

          test -f apps/web/package.json
          test -f .github/workflows/ci.yml
          test -f .github/workflows/codeql.yml
          test -f supabase/migrations/20260817000200_roadmap.sql
          test -f scripts/roadmap-import/cli.ts
          test -f docs/runbooks/BACKUP.md
          test -f tests/e2e/foundation.spec.ts
          test ! -e .foundation-payload

      - name: Commit materialized non-workflow tree
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/*'
          echo "Materialized staged paths: $(git diff --cached --name-only | wc -l | tr -d ' ')"
          git diff --cached --name-status | sed -n '1,180p'
          git diff --cached --quiet && { echo 'No materialization changes found'; exit 1; }
          git commit -m 'chore: materialize Foundation tree'
          git push origin HEAD:foundation/bootstrap
