name: Materialize Foundation payload

on:
  push:
    branches:
      - foundation/bootstrap

permissions:
  contents: write

jobs:
  materialize:
    name: materialize-foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate Foundation archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .foundation-payload
          part_count="$(find .foundation-payload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "$part_count" -gt 0
          find .foundation-payload -maxdepth 1 -type f -name 'part-*' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/foundation.b64
          base64 --decode /tmp/foundation.b64 > /tmp/foundation.tar.gz
          gzip -t /tmp/foundation.tar.gz
          tar -tzf /tmp/foundation.tar.gz > /tmp/foundation-files.txt
          test -s /tmp/foundation-files.txt

      - name: Materialize real Foundation tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/foundation.tar.gz -C .
          rm -rf .foundation-payload
          rm -f .github/workflows/materialize-foundation.yml

          test -f apps/web/package.json
          test -f .github/workflows/ci.yml
          test -f .github/workflows/codeql.yml
          test -f supabase/migrations/20260817000200_roadmap.sql
          test -f scripts/roadmap-import/cli.ts
          test -f docs/runbooks/BACKUP.md
          test -f tests/e2e/foundation.spec.ts
          test ! -e .foundation-payload

      - name: Commit materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo "Materialized changed paths: $(git diff --cached --name-only | wc -l | tr -d ' ')"
          git diff --cached --name-status | sed -n '1,160p'
          git diff --cached --quiet && { echo 'No materialization changes found'; exit 1; }
          git commit -m 'chore: materialize Foundation tree'
          git push origin HEAD:foundation/bootstrap
