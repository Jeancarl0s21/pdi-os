name: Format Foundation

on:
  push:
    branches:
      - foundation/bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format Foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: foundation/bootstrap
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format Foundation
        run: pnpm exec prettier --write .
      - name: Preserve formatted workflow sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-foundation-workflows
          path: |
            .github/workflows/backup.yml
            .github/workflows/ci.yml
            .github/workflows/codeql.yml
            .github/workflows/foundation-lockfile.yml
            .github/workflows/storage-reconcile.yml
          if-no-files-found: error
          retention-days: 1
      - name: Commit formatted non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/*'
          git diff --cached --quiet && { echo 'No non-workflow formatting changes'; exit 0; }
          git commit -m 'style: format Foundation'
          git push origin HEAD:foundation/bootstrap
